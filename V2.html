<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>学习大冒险 · 一年级 &amp; 三年级（科学 + 数学）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;min-height:100vh;color:#fff;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 12% 8%,#1e1b4b 0%,#1a0f3d 35%,#0a0518 70%,#04030d 100%);
  background-attachment:fixed;overflow-x:hidden;
}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
.sym{position:absolute;font-weight:900;color:rgba(147,197,253,.14);animation:drift linear infinite;user-select:none}
@keyframes drift{
  0%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-22px) rotate(14deg)}
  100%{transform:translateY(0) rotate(0)}
}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:18px 16px 40px}
.screen{display:none}
.screen.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 首页 ---------- */
.hero{text-align:center;padding:16px 0 6px}
.hero h1{
  font-size:32px;margin:0;letter-spacing:2px;
  background:linear-gradient(90deg,#6ee7ff,#a78bfa,#f472b6,#fbbf24);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(167,139,250,.45));
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero p{margin:8px 0 0;color:#c8c3e8;font-size:14px}
.mascot{font-size:54px;animation:bob 2.4s ease-in-out infinite;display:inline-block}

.pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.pack-card{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:22px 10px;border-radius:24px;cursor:pointer;
  border:2px solid rgba(255,255,255,.18);color:#fff;font-family:inherit;
  transition:transform .2s,box-shadow .2s;
}
.pack-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 46px rgba(0,0,0,.5)}
.pack-card:active{transform:scale(.97)}
.pack-emoji{font-size:38px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.pack-card b{font-size:16px;letter-spacing:1px;text-align:center;line-height:1.25}
.pack-card span{font-size:11px;opacity:.9}

/* ---------- 单元列表 ---------- */
.list-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.list-head h2{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.unit-card{
  position:relative;
  display:flex;align-items:center;gap:12px;text-align:left;
  padding:14px 14px;border-radius:20px;cursor:pointer;color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.14);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s;
  font-family:inherit;
}
.unit-card:hover{transform:translateY(-5px) scale(1.02);border-color:rgba(255,255,255,.45);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.unit-card:active{transform:scale(.97)}
.unit-icon{
  width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:grid;place-items:center;
  font-size:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
}
.unit-info{min-width:0;flex:1}
.unit-info b{display:block;font-size:15px;line-height:1.25}
.unit-info span{font-size:11px;color:#c9c4e6}
.best{position:absolute;top:7px;right:9px;font-size:10px;letter-spacing:-1px;opacity:.95}

/* ---------- 答题页 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icon-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer;transition:.15s;
}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.unit-tag{
  flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:9px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.score-pill{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2200;font-weight:800;
  border-radius:12px;padding:9px 13px;font-size:14px;box-shadow:0 6px 16px rgba(251,191,36,.3);
}
.progress{height:9px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#818cf8,#f472b6);transition:width .4s cubic-bezier(.3,1.4,.5,1)}

.card{
  background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:18px 16px 20px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.q-counter{font-size:12px;color:#b9b3dd;letter-spacing:1px;text-align:center;margin-bottom:4px}
.art{
  font-size:54px;text-align:center;line-height:1.25;padding:10px 0 6px;
  animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 20px rgba(120,90,255,.45));
  word-break:break-word;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
.question{font-size:17px;line-height:1.65;font-weight:700;text-align:center;margin:6px 0 18px}

.options{display:flex;flex-direction:column;gap:10px}
.option{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-radius:16px;font-size:15px;line-height:1.45;font-family:inherit;
  border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;
  cursor:pointer;transition:transform .14s,background .18s,border-color .18s;
}
.option:hover:not(.disabled){background:rgba(255,255,255,.15);border-color:#8ba4ff;transform:translateX(5px)}
.option.disabled{cursor:default}
.badge{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.16);font-weight:800;font-size:14px;
}
.option.correct{background:linear-gradient(90deg,#15803d,#22c55e);border-color:#86efac;animation:pop .45s}
.option.correct .badge{background:rgba(255,255,255,.3)}
.option.wrong{background:linear-gradient(90deg,#b91c1c,#ef4444);border-color:#fca5a5;animation:shake .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.feedback{margin-top:16px;display:none}
.feedback.show{display:block;animation:fadeIn .3s}
.fb-msg{border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px;text-align:center;margin-bottom:12px}
.fb-msg.ok{background:rgba(34,197,94,.18);border:1px solid rgba(134,239,172,.55);color:#bbf7d0}
.fb-msg.no{background:rgba(239,68,68,.16);border:1px solid rgba(252,165,165,.5);color:#fecaca}
.btn{
  width:100%;padding:15px;border-radius:16px;border:none;cursor:pointer;
  font-size:16px;font-weight:800;font-family:inherit;transition:transform .15s,filter .15s;
  background:rgba(255,255,255,.13);color:#fff;
}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);box-shadow:0 10px 26px rgba(139,92,246,.45)}

/* ---------- 结果页 ---------- */
.result-card{text-align:center;padding:28px 18px}
.big-stars{font-size:44px;letter-spacing:6px;margin-bottom:8px}
.big-stars span{display:inline-block;animation:pop .5s backwards}
.result-card h2{font-size:24px;margin:6px 0}
.result-score{font-size:44px;font-weight:900;margin:6px 0;background:linear-gradient(90deg,#6ee7ff,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-card p{color:#cdc7ec;font-size:15px;margin:6px 0 22px}
.result-btns{display:flex;flex-direction:column;gap:10px}

.confetti{position:fixed;top:-50px;z-index:999;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:.15}}
</style>
</head>
<body>
<div id="bg"></div>

<div class="wrap">

  <!-- ============ 首页 ============ -->
  <section id="home" class="screen active">
    <div class="hero">
      <div class="mascot">🎒</div>
      <h1>学习大冒险</h1>
      <p>一年级 &amp; 三年级 · 科学 + 数学 · 36 单元 · 360 题</p>
    </div>
    <div class="pack-grid" id="packGrid"></div>
  </section>

  <!-- ============ 单元列表 ============ -->
  <section id="unitList" class="screen">
    <div class="list-head">
      <button class="icon-btn" id="btnToHome">←</button>
      <h2 id="listTitle">选择单元</h2>
    </div>
    <div class="grid" id="unitGrid"></div>
  </section>

  <!-- ============ 答题页 ============ -->
  <section id="quiz" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btnBackList" title="返回单元列表">←</button>
      <div class="unit-tag"><span id="unitIcon">🔬</span><span id="unitName">单元</span></div>
      <div class="score-pill">⭐ <span id="scoreNum">0</span></div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

    <div class="card">
      <div class="q-counter" id="qCounter">第 1 / 10 题</div>
      <div class="art" id="art">🔬</div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <!-- ============ 结果页 ============ -->
  <section id="result" class="screen">
    <div class="card result-card">
      <div class="big-stars" id="bigStars"></div>
      <h2 id="resultTitle"></h2>
      <div class="result-score"><span id="resScore">0</span> / <span id="resTotal">10</span></div>
      <p id="resultMsg"></p>
      <div class="result-btns">
        <button class="btn primary" id="btnRetry">🔁 再来一次</button>
        <button class="btn" id="btnGoList">📚 选择其他单元</button>
        <button class="btn" id="btnGoHome">🏠 返回首页</button>
      </div>
    </div>
  </section>

</div>

<script>
/* =====================================================================
   题库数据
   a = 正确选项索引(0起)  art = 题目标配图  t = 题目  o = 选项
   ===================================================================== */
const DATA = {

};

/* ==================== 背景装饰 ==================== */
(function makeBg(){
  const box = document.getElementById('bg');
  let html = '';
  for(let i=0;i<80;i++){
    const s = Math.random()*2.2+1;
    html += `<div class="star" style="left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;animation-delay:${(Math.random()*3).toFixed(2)}s"></div>`;
  }
  const syms = ['+','−','×','÷','=','½','¼','¾','%','√','π','🧲','🌱','🦷','🌍','🔬','🧪','📏','⏰','🪐','⬛','🔺','⭕','📦'];
  for(let i=0;i<20;i++){
    const size = 20 + Math.random()*42;
    html += `<div class="sym" style="left:${Math.random()*95}%;top:${Math.random()*100}%;font-size:${size}px;animation-duration:${(6+Math.random()*7).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s">${syms[Math.floor(Math.random()*syms.length)]}</div>`;
  }

/* ==================== 音效 ==================== */
let actx = null;
function beep(freq, dur, type='sine', vol=0.07){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  }catch(e){}
}
function sndCorrect(){ beep(660,.12); setTimeout(()=>beep(880,.18),100); }
function sndWrong(){ beep(200,.28,'sawtooth',.05); }

/* ==================== 彩带 ==================== */
function burst(){
  const chars = ['🎉','⭐','✨','🌟','💫','🎊','🏅','➕','✖️','🔬','🧮','📦','🔺'];
  for(let i=0;i<20;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = chars[Math.floor(Math.random()*chars.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.fontSize = (16 + Math.random()*22) + 'px';
    el.style.animationDuration = (1.2 + Math.random()*1.1) + 's';
    el.style.animationDelay = (Math.random()*0.3) + 's';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2800);
  }
}

/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
const screens = {
  home:$('home'), unitList:$('unitList'),
  quiz:$('quiz'), result:$('result')
};
function show(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* 每轮打乱选项顺序 */
function shuffleUnit(unit){
  const qs = unit.qs.map(q=>{
    const idx = q.o.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [idx[i],idx[j]] = [idx[j],idx[i]];
    }
    return { ...q, o: idx.map(i=>q.o[i]), a: idx.indexOf(q.a) };
  });
  return { ...unit, qs };
}

/* ==================== 状态 ==================== */
const state = { packKey:null, pack:null, unit:null, unitIndex:0, qi:0, score:0, answered:false };

/* ==================== 首页 ==================== */
function renderHome(){
  const grid = $('packGrid');
  grid.innerHTML = '';
  const order = ['p1sci','p1math','p3sci','p3math'];
  order.forEach(key=>{
    const p = DATA[key];
    const btn = document.createElement('button');
    btn.className = 'pack-card';
    btn.style.background = p.grad;
    btn.innerHTML = `
      <span class="pack-emoji">${p.emoji}</span>
      <b>${p.label}</b>
      <span>${p.sub}</span>`;
    btn.onclick = ()=> openPack(key);
    grid.appendChild(btn);
  });
}

/* ==================== 打开题库 ==================== */
function openPack(key){
  state.packKey = key;
  state.pack = DATA[key];
  $('listTitle').textContent = `${state.pack.emoji} ${state.pack.label} · 选择单元`;
  renderUnits();
  show('unitList');
}

/* ==================== 单元列表 ==================== */
function bestKey(i){ return 'best_' + state.packKey + '_' + i; }
function getBest(i){
  const v = parseInt(localStorage.getItem(bestKey(i)) || '0', 10);
  return isNaN(v) ? 0 : v;
}

function renderUnits(){
  const grid = $('unitGrid');
  grid.innerHTML = '';
  state.pack.units.forEach((u, idx)=>{
    const best = getBest(idx);
    const starTxt = best ? '⭐'.repeat(best) : '';
    const btn = document.createElement('button');
    btn.className = 'unit-card';
    btn.innerHTML = `
      <div class="unit-icon" style="background:linear-gradient(135deg,${u.color},${u.color}66)">${u.icon}</div>
      <div class="unit-info">
        <b>第${idx+1}课 · ${u.name}</b>
        <span>${u.qs.length} 道题</span>
      </div>
      ${starTxt ? `<div class="best">${starTxt}</div>` : ''}`;
    btn.onclick = ()=> startUnit(idx);
    grid.appendChild(btn);
  });
}

/* ==================== 开始单元 ==================== */
function startUnit(idx){
  state.unitIndex = idx;
  state.unit = shuffleUnit(state.pack.units[idx]);
  state.qi = 0;
  state.score = 0;
  state.answered = false;

  $('unitIcon').textContent = state.unit.icon;
  $('unitName').textContent = state.unit.name;
  $('scoreNum').textContent = '0';

  show('quiz');
  renderQuestion();
}

/* ==================== 渲染题目 ==================== */
function renderQuestion(){
  const unit = state.unit;
  const q = unit.qs[state.qi];
  state.answered = false;

  const total = unit.qs.length;
  $('progressFill').style.width = (state.qi / total * 100) + '%';
  $('qCounter').textContent = `第 ${state.qi + 1} / ${total} 题`;
  $('scoreNum').textContent = state.score;

  const artEl = $('art');
  artEl.style.animation = 'none';
  void artEl.offsetWidth;
  artEl.style.animation = '';
  artEl.textContent = q.art;

  $('question').textContent = q.t;

  const letters = ['A','B','C','D'];
  const box = $('options');
  box.innerHTML = '';
  q.o.forEach((text, i)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.innerHTML = `<span class="badge">${letters[i]}</span><span>${text}</span>`;
    b.onclick = ()=> choose(i, b);
    box.appendChild(b);
  });

  const fb = $('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
}

/* ==================== 选择答案 ==================== */
function choose(i, btn){
  if(state.answered) return;
  state.answered = true;

  const q = state.unit.qs[state.qi];
  const all = Array.from($('options').children);
  all.forEach(b => b.classList.add('disabled'));

  const correct = (i === q.a);

  if(correct){
    btn.classList.add('correct');
    state.score++;
    $('scoreNum').textContent = state.score;
    sndCorrect();
    burst();
    if(navigator.vibrate) navigator.vibrate(25);
    showFeedback(true, null);
  }else{
    btn.classList.add('wrong');
    all[q.a].classList.add('correct');
    sndWrong();
    if(navigator.vibrate) navigator.vibrate([40,60,40]);
    showFeedback(false, q.o[q.a]);
  }
}

/* ==================== 反馈 ==================== */
function showFeedback(ok, correctText){
  const fb = $('feedback');
  const isLast = (state.qi === state.unit.qs.length - 1);

  const msg = ok
    ? `<div class="fb-msg ok">🎉 答对了！太棒了！</div>`
    : `<div class="fb-msg no">💡 正确答案是：${correctText}</div>`;

  fb.innerHTML = msg + `<button class="btn primary" id="btnNext">${isLast ? '🏁 查看成绩' : '下一题 ➡'}</button>`;
  fb.className = 'feedback show';
  $('btnNext').onclick = nextQuestion;
  $('btnNext').focus({preventScroll:true});
}

/* ==================== 下一题 ==================== */
function nextQuestion(){
  if(state.qi < state.unit.qs.length - 1){
    state.qi++;
    renderQuestion();
    window.scrollTo({top:0,behavior:'smooth'});
  }else{
    $('progressFill').style.width = '100%';
    showResult();
  }
}

/* ==================== 结算 ==================== */
function showResult(){
  const total = state.unit.qs.length;
  const score = state.score;
  const pct = score / total;

  let stars = 0, title = '', msg = '';
  if(pct >= 0.9){ stars = 3; title = '学习小博士！🏆'; msg = '太厉害了，你完全掌握了这个单元！'; }
  else if(pct >= 0.7){ stars = 2; title = '表现很棒！🌟'; msg = '再复习一下错题就完美啦！'; }
  else if(pct >= 0.5){ stars = 1; title = '继续加油！💪'; msg = '已经答对一半以上，再来挑战一次吧！'; }
  else { stars = 0; title = '别灰心哦 🌱'; msg = '仔细读题，再试一次一定会更好！'; }

  const key = bestKey(state.unitIndex);
  if(stars > getBest(state.unitIndex)) localStorage.setItem(key, String(stars));

  let starHTML = '';
  for(let i=0;i<3;i++){
    const filled = i < stars;
    starHTML += `<span style="animation-delay:${i*0.12}s;filter:${filled?'drop-shadow(0 0 12px rgba(251,191,36,.85))':'grayscale(1) opacity(.3)'}">${filled?'⭐':'☆'}</span>`;
  }
  $('bigStars').innerHTML = starHTML;
  $('resultTitle').textContent = title;
  $('resScore').textContent = score;
  $('resTotal').textContent = total;
  $('resultMsg').textContent = msg;

  if(stars >= 2) setTimeout(burst, 250);
  show('result');
}

/* ==================== 按钮绑定 ==================== */
$('btnToHome').onclick = ()=>{ renderHome(); show('home'); };
$('btnBackList').onclick = ()=>{ renderUnits(); show('unitList'); };
$('btnGoHome').onclick = ()=>{ renderHome(); show('home'); };
$('btnGoList').onclick = ()=>{ renderUnits(); show('unitList'); };
$('btnRetry').onclick = ()=>{ startUnit(state.unitIndex); };

/* ==================== 启动 ==================== */
renderHome();
show('home');
</script>
